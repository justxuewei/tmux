# ──────────────────────────────────────────────────────────
# General
# ──────────────────────────────────────────────────────────
set -g mouse on
# Don't let dragging the pane border resize panes (use prefix H/J/K/L instead)
unbind -n MouseDrag1Border
setw -g mode-keys vi
set -g focus-events on

# True color + italics (adjust if your terminal's $TERM differs)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g history-limit 50000      # bigger scrollback buffer
set -sg escape-time 10          # snappier ESC (avoids vim lag)
set -g display-time 2000        # status messages stay longer
set -g renumber-windows on      # close a window, others renumber
set -g set-clipboard on         # let apps set the system clipboard
set -g base-index 1             # start window numbering at 1
setw -g pane-base-index 1       # start pane numbering at 1
set -g detach-on-destroy off    # closing last pane switches session, not exit tmux

# ──────────────────────────────────────────────────────────
# Prefix
# ──────────────────────────────────────────────────────────
# Uncomment to use C-a instead of the default C-b:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ──────────────────────────────────────────────────────────
# Reload config:  <prefix> r
# ──────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ──────────────────────────────────────────────────────────
# Splits & new windows keep the current path
# ──────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# ──────────────────────────────────────────────────────────
# Pane navigation (vim-style):  <prefix> h/j/k/l
# ──────────────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize (repeatable: hold after prefix, press H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ──────────────────────────────────────────────────────────
# Copy mode (vi keys)
# ──────────────────────────────────────────────────────────
# Don't select-pane on drag-start, so a fast drag across a pane border
# doesn't switch panes and spill the selection into the neighbor.
bind -T copy-mode-vi MouseDrag1Pane send -X begin-selection

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Enter copies and exits copy mode (back to the prompt).
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
# c copies but stays in copy mode, keeping the highlight so you can see what was
# copied and keep selecting. Press q/Escape to leave when you're done.
bind -T copy-mode-vi c send -X copy-selection-no-clear
# Copy on mouse-drag release but keep the region highlighted and stay in copy
# mode. Plain `copy-selection` would clear the highlight; the `-no-clear`
# variant leaves it on screen until you click elsewhere.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# Double-click and triple-click select text only. The default bindings copy
# after a short delay and exit copy mode, which is disruptive in visual mode.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line

# A plain left-click clears the lingering highlight (and moves pane focus).
# At the start of a new drag this fires first, harmlessly clearing the old
# selection before begin-selection starts a fresh one.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send -X clear-selection

# Slower mouse-wheel scroll (default is 5 lines per notch)
bind -T copy-mode-vi WheelUpPane   send -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 2 scroll-down

# ──────────────────────────────────────────────────────────
# Alerts & notifications
# ──────────────────────────────────────────────────────────
# Catch the terminal bell from any window (an agent can ring it when it
# wants your attention). Keep visual-bell OFF so the real bell passes
# through to the terminal — let iTerm2 ("Notify on bell") turn it into a
# macOS notification. Make sure your agent rings the bell when it waits
# for input (e.g. Claude Code: notification channel = terminal bell).
setw -g monitor-bell on
set  -g bell-action any
set  -g visual-bell off

# Make the alerting window obvious in the status bar.
# (Activity style only triggers if you also enable `setw monitor-activity on`;
#  silence with `setw monitor-silence <seconds>`.)
setw -g window-status-bell-style     "fg=black,bg=red,bold"
setw -g window-status-activity-style "fg=black,bg=yellow"

# ──────────────────────────────────────────────────────────
# Coding-agent status
# ──────────────────────────────────────────────────────────
# Claude Code / Codex run hooks that call ~/.claude/tmux-agent-status.sh,
# which tags each pane (@pane_agent = "cc:working" etc), records each window's
# most-urgent state (@win_state), and on the transition INTO "waiting" fires a
# desktop notification naming the window (via OSC 9 + tmux passthrough below).
#
# (1) Per-window tab markers: a window with an agent gets a symbol after its
#     name, so you can see WHICH window needs you and press its number to jump.
#     No colors are used (green bar, black text); the symbol carries the state:
#       waiting -> ●   working -> ◐   idle -> ✓
#     The current window is wrapped in [brackets] (plain text, no color/bold).
set -g status-interval 5
setw -g window-status-format         " #I:#W#{?@win_state, #{?#{==:#{@win_state},waiting},●,#{?#{==:#{@win_state},working},◐,✓}},} "
setw -g window-status-current-format "[#I:#W#{?@win_state, #{?#{==:#{@win_state},waiting},●,#{?#{==:#{@win_state},working},◐,✓}},}]"

# (2) Multiple agents in one window (one per pane): the tab color only shows
#     the most urgent state, so also label each pane in its border. The hook
#     enables the border line only while a window is split, so single-pane
#     windows don't lose a row to it.
set -g pane-border-status off
set -g pane-border-format " #{pane_index}:#{pane_current_command}#{?@pane_agent, [#{@pane_agent}],} "
set-hook -g window-layout-changed 'if -F "#{>:#{window_panes},1}" "set-window-option pane-border-status top" "set-window-option pane-border-status off"'

# (3) Global summary on the right: cc [1]working | cx [1]idle  (totals at a glance)
set -g status-right-length 120
set -g status-right "#{@agents_summary}  %a %H:%M "

# (4) Let the script's OSC 9 notification reach the outer terminal (iTerm2).
set -g allow-passthrough on

# Recompute when a pane's process exits or dies, so finished agents clear out
# of the tabs/summary without waiting for the next hook.
set-hook -g pane-exited 'run-shell -b "~/.claude/tmux-agent-status.sh refresh"'
set-hook -g pane-died   'run-shell -b "~/.claude/tmux-agent-status.sh refresh"'

# ──────────────────────────────────────────────────────────
# Synchronize panes:  <prefix> S  (type into every pane at once; toggle)
# ──────────────────────────────────────────────────────────
bind S set-window-option synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"
